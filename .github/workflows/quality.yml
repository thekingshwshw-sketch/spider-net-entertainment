name: Static site quality
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s admin.html
          test -s README.md
      - name: Validate HTML and unsafe URL patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          files = [Path("index.html"), Path("admin.html")]
          failed = False
          for path in files:
              text = path.read_text(encoding="utf-8")
              checks = {
                  "HTML document": "<!doctype html>" in text.lower(),
                  "Arabic RTL": 'dir="rtl"' in text,
                  "viewport": 'name="viewport"' in text,
                  "no javascript: URL literal": not re.search(r'href\\s*=\\s*["\\']\\s*javascript:', text, re.I),
              }
              for name, ok in checks.items():
                  print(f"{path}: {name}: {'PASS' if ok else 'FAIL'}")
                  failed |= not ok
          if failed:
              sys.exit(1)
          PY
